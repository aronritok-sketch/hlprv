[project]
name = "seo-os-api"
version = "0.1.0"
description = "HelloProVision SEO OS – backend (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "weasyprint>=62",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "openai>=1.40",
    "anthropic>=0.40",
    "pypdf>=4",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
