user root;
worker_processes auto;
pid /home/container/logs/nginx/nginx.pid;
error_log /dev/null info;
include /etc/openresty/modules-enabled/*.conf;



events {
	worker_connections 1024;
	multi_accept on;
}

# Enable stream module for multiplexing
stream {
    map_hash_bucket_size 256;

    upstream imap_backend {
        server 127.0.0.1:993;
    }

    upstream pop3_backend {
        server 127.0.0.1:995;
    }

    upstream smtps_backend {
        server 127.0.0.1:465;
    }

    upstream smtp_backend {
        server 127.0.0.1:25;
    }

    upstream webstream_backend {
        server 127.0.0.1:9001;
    }

    upstream https_backend {
        server 127.0.0.1:443;
    }

    upstream http_backend {
        server 127.0.0.1:80;
    }

    map $ssl_preread_server_name $primary_upstream {
        helloprovision.com          webstream_backend;
        www.helloprovision.com      webstream_backend;

        crm.helloprovision.com      webstream_backend;
        clients.helloprovision.com  webstream_backend;
        seo.helloprovision.com      webstream_backend;

        smtp.helloprovision.com     smtps_backend;
        imap.helloprovision.com     imap_backend;
        pop3.helloprovision.com     pop3_backend;

        default                     webstream_backend;
    }

    map $ssl_preread_protocol $web_upstream {
        default https_backend;
        ""      http_backend;
    }

    server {
        listen 10012;
        listen [::]:10012;

        # Enable SSL passthrough for encrypted traffic
        ssl_preread on;

        # Pass traffic to appropriate upstream.
        proxy_pass $primary_upstream;
    }

    server {
        listen 9001;
        listen [::]:9001;

        # Enable SSL passthrough for encrypted traffic
        ssl_preread on;

        proxy_protocol on;

        proxy_pass $web_upstream;
    }

    server {
        listen *:10013;

        proxy_pass smtp_backend;
    }
}

http {
    ##
    # Basic Settings
    ##

    map_hash_bucket_size 256;
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    # server_tokens off;

    server_names_hash_bucket_size 256;
    # server_name_in_redirect off;

    include /etc/openresty/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
    ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##

    access_log off;

    ##
    # Gzip Settings
    ##

    gzip on;

    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_body_temp_path /home/container/tmp/nginx/clientbody;
    proxy_temp_path /home/container/tmp/nginx/proxy;
    fastcgi_temp_path /home/container/tmp/nginx/fastcgi;
    scgi_temp_path /home/container/tmp/nginx/scgi;
    uwsgi_temp_path /home/container/tmp/nginx/uwsgi;

    ##
    # helloprovision.com – marketing weboldal (webroot/wordpress) – VÁLTOZATLAN
    ##

    server {
        listen *:80 proxy_protocol;

        server_name helloprovision.com www.helloprovision.com;

        include /home/container/etc/nginx/ssl-website.conf*;

        access_by_lua_block {
            local blocked_uris = {
                "manifest.json",
            }

            for _, pattern in ipairs(blocked_uris) do
                if ngx.var.request_uri:match(pattern) then
                    ngx.log(ngx.NOTICE, "Blocked URI: " .. ngx.var.request_uri)
                    ngx.exit(ngx.HTTP_FORBIDDEN)
                    return
                end
            end

            -- Run lambda script to hot-start services
            local status = os.execute('/scripts/lambda-startup.sh 3600')

            -- Check the return status
            if status == 0 then
                ngx.log(ngx.INFO, "Lambda script startup for php-fpm successful.")
            else
                ngx.log(ngx.ERR, "Failed to startup php-fpm lambda.")
            end
        }

        # Redirect www to non-www
        if ($host = 'www.helloprovision.com') {
            return 301 $scheme://helloprovision.com$request_uri;
        }

        root /home/container/webroot/wordpress;
        index index.html index.htm index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
        # allow larger file uploads and longer script runtimes
        client_max_body_size 100m;
        client_body_timeout 120s;
        sendfile off;
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/home/container/tmp/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location ~ /\.ht {
            deny all;
        }
    }

    ##
    # crm / clients / seo.helloprovision.com – a közös CRM WordPress (webroot/crm):
    # CRM, ügyfélportál és SEO OS egy telepítésben; a cím alapján döntik el, mit mutatnak.
    # (Ez az egy blokk váltja a korábbi három crm / clients / seo blokkot.)
    ##

    server {
        listen *:80 proxy_protocol;

        server_name crm.helloprovision.com clients.helloprovision.com seo.helloprovision.com;

        include /home/container/etc/nginx/ssl-website.conf*;

        access_by_lua_block {
            -- Run lambda script to hot-start services
            local status = os.execute('/scripts/lambda-startup.sh 3600')

            if status == 0 then
                ngx.log(ngx.INFO, "Lambda script startup for php-fpm successful.")
            else
                ngx.log(ngx.ERR, "Failed to startup php-fpm lambda.")
            end
        }

        root /home/container/webroot/crm;
        index index.php index.html index.htm;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
        client_max_body_size 100m;
        client_body_timeout 120s;
        sendfile off;
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/home/container/tmp/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location ~ /\.ht {
            deny all;
        }
    }

    ##
    # mail.helloprovision.com – webmail (webroot/roundcubemail) – VÁLTOZATLAN
    ##

    server {
        listen *:80 proxy_protocol;

        server_name mail.helloprovision.com;

        include /home/container/etc/nginx/ssl-webmail.conf*;

        root /home/container/webroot/roundcubemail;
        index index.html index.htm index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
        # allow larger file uploads and longer script runtimes
        client_max_body_size 100m;
        client_body_timeout 120s;
        sendfile off;
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/home/container/tmp/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }

        location ~ /\.ht {
            deny all;
        }
    }

    ##
    # Minden más cím – VÁLTOZATLAN
    ##

    server {
        server_name _;
        listen *:80 proxy_protocol default_server deferred;

        include /home/container/etc/nginx/ssl-default.conf*;

        return 404;
    }
}
