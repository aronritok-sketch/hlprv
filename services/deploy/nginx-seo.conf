# seo.helloprovision.com – ez a blokk CSERÉLI a meglévő „server_name seo.helloprovision.com” blokkot a nginx.conf-ban.
#
# Mit csinál:
#   - HTTPS-t is fogad (ugyanaz az SSL-beállítás, mint a fő weboldalé), így nem a „default” szerver válaszol 404-gyel;
#   - a PHP-t (WordPresst) szolgálja ki a CRM WordPressből – az SEO OS bővítménynek a CRM-mel közös WordPressben a helye;
#   - a fő weboldalhoz hasonlóan „felébreszti” a php-fpm-et (lambda-startup), különben a PHP nem válaszolna.
# Az SEO OS háttérrendszere (API) NEM itt fut, hanem a Renderen – ezért nincs benne proxy_pass.
server {
    listen *:80 proxy_protocol;

    server_name seo.helloprovision.com;

    include /home/container/etc/nginx/ssl-website.conf*;

    access_by_lua_block {
        local status = os.execute('/scripts/lambda-startup.sh 3600')
        if status == 0 then
            ngx.log(ngx.INFO, "Lambda script startup for php-fpm successful.")
        else
            ngx.log(ngx.ERR, "Failed to startup php-fpm lambda.")
        end
    }

    # Ugyanaz a WordPress, mint a crm.helloprovision.com-é.
    root /home/container/webroot/crm;
    index index.php index.html index.htm;
    charset utf-8;

    client_max_body_size 100m;
    client_body_timeout 120s;
    sendfile off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/home/container/tmp/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
